# Replace your-domain.example with the real domain before first deploy —
# see nginx/README.md for the initial Let's Encrypt certificate issuance
# steps (this config assumes the certs already exist).

server {
    listen 80;
    server_name your-domain.example;

    # Required for certbot's renewal webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    client_max_body_size 5G; # task attachments, TT §2.4

    # Chat's WebSocket namespace (/chat) needs the Upgrade/Connection
    # headers; everything else is a plain REST proxy to the backend.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s; # keep long-lived WS connections open
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Once the React web app is built, its static output is served from
    # here instead of proxying to the backend for non-API routes — not
    # wired up yet since the frontend hasn't been built this pass.
}
